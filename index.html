<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CatalogCraft – Free All-in-One Shop Website Builder & UI Component Library</title>
  <meta name="description" content="Free no-code website builder for shops and small businesses with 20 design systems, 22 business categories, large UI component library, and QR sharing.">

  <!-- Free Open Google Fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;1,400&family=Space+Grotesk:wght@600;700&family=Poppins:wght@600;700&family=Lora:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@700;800&family=Quicksand:wght@600;700&family=Nunito:wght@600;700&family=Cormorant+Garamond:wght@700&family=Oswald:wght@700&family=Raleway:wght@600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap">

  <!-- Free Open-Source Libraries (JSZip & QRCode.js) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <!-- Application Stylesheets -->
  <link rel="stylesheet" href="css/components.css" id="components-css-link">
  <link rel="stylesheet" href="css/builder.css">
  <link rel="stylesheet" href="css/full-control.css">
</head>
<body>

  <div class="builder-layout">
    <!-- LEFT SIDEBAR: DESIGN & VISUAL CONTROLS -->
    <aside class="builder-sidebar">
      <div class="sidebar-header">
        <div class="builder-logo">
          <span>✨</span>
          <div>
            CatalogCraft
            <small>All-in-One Free Shop Builder</small>
          </div>
        </div>
        <div class="header-quick-tools">
          <button class="tool-btn" onclick="App.undo()" title="Undo (Ctrl+Z)">↶</button>
          <button class="tool-btn" onclick="App.redo()" title="Redo (Ctrl+Y)">↷</button>
          <button class="tool-btn" onclick="App.toggleTheme()" title="Toggle Dark/Light Mode">◐</button>
        </div>
      </div>

      <!-- Navigation Tabs -->
      <nav class="sidebar-tabs" aria-label="Editor Panels">
        <button class="tab-btn active" data-tab="design" onclick="App.setTab('design')">🎨 Design</button>
        <button class="tab-btn" data-tab="content" onclick="App.setTab('content')">📝 Content</button>
        <button class="tab-btn" data-tab="buttons" onclick="App.setTab('buttons')">🔘 Buttons</button>
        <button class="tab-btn" data-tab="components" onclick="App.setTab('components')">🧩 Library</button>
        <button class="tab-btn" data-tab="fullcontrol" onclick="FullControl.openStudio()" style="color:var(--ed-primary);font-weight:800">⚡ Full Control</button>
        <button class="tab-btn" data-tab="share" onclick="App.setTab('share')">🚀 Export</button>
      </nav>

      <!-- Tab Content Panels -->
      <div class="sidebar-content">
        <div class="tab-panel active" id="panel-design"></div>
        <div class="tab-panel" id="panel-content"></div>
        <div class="tab-panel" id="panel-buttons"></div>
        <div class="tab-panel" id="panel-components"></div>
        <div class="tab-panel" id="panel-share"></div>
      </div>
    </aside>

    <!-- RIGHT MAIN: LIVE RESPONSIVE PREVIEW VIEWPORT -->
    <main class="builder-viewport-area">
      <div class="viewport-toolbar">
        <div class="device-switcher">
          <button class="device-btn active" data-view="desktop" onclick="App.setViewport('desktop')">🖥️ Desktop</button>
          <button class="device-btn" data-view="tablet" onclick="App.setViewport('tablet')">📱 Tablet (768px)</button>
          <button class="device-btn" data-view="mobile" onclick="App.setViewport('mobile')">📱 Mobile (390px)</button>
        </div>

        <div class="viewport-status">
          <span class="status-indicator"></span>
          <span>Live Interactive Preview</span>
        </div>

        <div style="display:flex;gap:8px;align-items:center">
          <button class="craft-btn btn-primary btn-sm btn-shape-soft" onclick="FullControl.openStudio()" style="background:linear-gradient(135deg,#4f46e5,#06b6d4);color:#ffffff;border:none">
            <span>⚡ Full Control Studio</span>
          </button>
          <button class="craft-btn btn-outline btn-sm btn-shape-soft" onclick="App.exportHtml()">
            <span>📥 Export HTML</span>
          </button>
        </div>
      </div>

      <div class="preview-stage">
        <div class="preview-frame-container frame-desktop" id="preview-frame">
          <div id="preview-container"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Notification Toast -->
  <div class="builder-toast" id="builder-toast"></div>

  <!-- Modular Application Scripts -->
  <script src="js/data/components-css.js"></script>
  <script src="js/data/design-systems.js"></script>
  <script src="js/data/templates.js"></script>
  <script src="js/data/components-registry.js"></script>
  <script src="js/modules/buttons.js"></script>
  <script src="js/modules/color-studio.js"></script>
  <script src="js/modules/background-studio.js"></script>
  <script src="js/modules/full-control.js"></script>
  <script src="js/modules/renderer.js"></script>
  <script src="js/modules/exporter.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
